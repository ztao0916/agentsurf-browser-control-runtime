<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AgentSurf</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --card-bg: #f8fafc;
        --card-border: #e2e8f0;
        --text: #0f172a;
        --text-muted: #64748b;
        --input-border: #cbd5e1;
        --input-bg: #ffffff;
        --primary: #2563eb;
        --primary-hover: #1d4ed8;
        --outline-hover: #f1f5f9;
        --success: #16a34a;
        --success-bg: rgba(22, 163, 74, 0.1);
        --success-border: rgba(22, 163, 74, 0.25);
        --warn: #d97706;
        --warn-bg: rgba(217, 119, 6, 0.1);
        --warn-border: rgba(217, 119, 6, 0.25);
        --danger: #dc2626;
        --danger-bg: rgba(220, 38, 38, 0.1);
        --danger-border: rgba(220, 38, 38, 0.25);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #18181b;
          --card-bg: #27272a;
          --card-border: #3f3f46;
          --text: #f4f4f5;
          --text-muted: #a1a1aa;
          --input-border: #3f3f46;
          --input-bg: #18181b;
          --primary: #3b82f6;
          --primary-hover: #2563eb;
          --outline-hover: #27272a;
          --success: #22c55e;
          --success-bg: rgba(34, 197, 94, 0.15);
          --success-border: rgba(34, 197, 94, 0.3);
          --warn: #f59e0b;
          --warn-bg: rgba(245, 158, 11, 0.15);
          --warn-border: rgba(245, 158, 11, 0.3);
          --danger: #ef4444;
          --danger-bg: rgba(239, 68, 68, 0.15);
          --danger-border: rgba(239, 68, 68, 0.3);
        }
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        padding: 14px 16px;
        width: 330px;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
        font-size: 12px;
        line-height: 1.4;
        -webkit-font-smoothing: antialiased;
      }

      /* Header */
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .logo-icon {
        width: 22px;
        height: 22px;
        background: linear-gradient(135deg, #2563eb, #3b82f6);
        color: #ffffff;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 12px;
        box-shadow: 0 1px 3px rgba(37, 99, 235, 0.3);
      }

      .brand-title {
        font-size: 14px;
        font-weight: 700;
        letter-spacing: -0.02em;
        margin: 0;
      }

      /* Status Badge */
      .status-badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 2.5px 8px;
        border-radius: 9999px;
        font-size: 11px;
        font-weight: 500;
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        color: var(--text-muted);
        transition: all 0.2s ease;
      }

      .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #94a3b8;
        flex: none;
      }

      .status-badge.connected {
        background: var(--success-bg);
        border-color: var(--success-border);
        color: var(--success);
      }
      .status-badge.connected .dot {
        background: var(--success);
        box-shadow: 0 0 6px var(--success);
      }

      .status-badge.connecting, .status-badge.reconnecting {
        background: var(--warn-bg);
        border-color: var(--warn-border);
        color: var(--warn);
      }
      .status-badge.connecting .dot, .status-badge.reconnecting .dot {
        background: var(--warn);
        animation: pulse 1.5s infinite;
      }

      .status-badge.error {
        background: var(--danger-bg);
        border-color: var(--danger-border);
        color: var(--danger);
      }
      .status-badge.error .dot {
        background: var(--danger);
      }

      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.85); }
      }

      /* Cards */
      .card {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 10px;
        padding: 10px 12px;
        margin-bottom: 10px;
      }

      .card-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 4px;
      }

      .card-title {
        display: flex;
        align-items: center;
        gap: 6px;
        font-weight: 600;
        font-size: 12px;
        color: var(--text);
      }

      .card-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 11px;
        margin-top: 4px;
      }

      .card-row .label { color: var(--text-muted); }
      .card-row .val { font-family: ui-monospace, monospace; font-weight: 500; }

      .card-hint {
        margin: 6px 0 0;
        padding-top: 6px;
        border-top: 1px solid var(--card-border);
        color: var(--text-muted);
        font-size: 10.5px;
        line-height: 1.35;
      }

      /* Toggle Switch */
      .switch {
        position: relative;
        display: inline-block;
        width: 32px;
        height: 18px;
        flex: none;
      }
      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }
      .slider {
        position: absolute;
        cursor: pointer;
        top: 0; left: 0; right: 0; bottom: 0;
        background-color: var(--card-border);
        transition: .2s;
        border-radius: 18px;
      }
      .slider:before {
        position: absolute;
        content: "";
        height: 14px;
        width: 14px;
        left: 2px;
        bottom: 2px;
        background-color: #ffffff;
        transition: .2s;
        border-radius: 50%;
        box-shadow: 0 1px 2px rgba(0,0,0,0.25);
      }
      input:checked + .slider {
        background-color: var(--primary);
      }
      input:checked + .slider:before {
        transform: translateX(14px);
      }

      /* Form Fields */
      .field {
        margin-top: 8px;
      }

      .field-label {
        display: block;
        font-size: 11px;
        font-weight: 500;
        color: var(--text-muted);
        margin-bottom: 3px;
      }

      input[type="text"], input[type="password"] {
        width: 100%;
        padding: 6px 8px;
        font-size: 11px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        background: var(--input-bg);
        color: var(--text);
        border: 1px solid var(--input-border);
        border-radius: 6px;
        outline: none;
        transition: border-color 0.15s, box-shadow 0.15s;
      }

      input[type="text"]:focus, input[type="password"]:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.15);
      }

      /* Buttons */
      .button-row {
        display: flex;
        gap: 6px;
        margin-top: 8px;
      }

      .btn {
        flex: 1;
        padding: 6px 10px;
        font-size: 11px;
        font-weight: 500;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.15s ease;
        border: 1px solid transparent;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .btn-primary {
        background: var(--primary);
        color: #ffffff;
        font-weight: 600;
      }
      .btn-primary:hover {
        background: var(--primary-hover);
      }

      .btn-outline {
        background: transparent;
        color: var(--text);
        border-color: var(--card-border);
      }
      .btn-outline:hover {
        background: var(--outline-hover);
      }

      .text-action {
        background: none;
        border: none;
        padding: 0;
        font-size: 10.5px;
        color: var(--primary);
        cursor: pointer;
        font-weight: 500;
      }
      .text-action:hover {
        text-decoration: underline;
      }

      .gateway-status-box {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 6px 8px;
        border-radius: 6px;
        background: var(--success-bg);
        border: 1px solid var(--success-border);
        color: var(--success);
        font-size: 11px;
        font-weight: 500;
        margin-top: 6px;
      }

      .gateway-status-box.warn {
        background: var(--warn-bg);
        border-color: var(--warn-border);
        color: var(--warn);
      }

      .gateway-disabled-box {
        padding: 6px 8px;
        border-radius: 6px;
        background: rgba(128,128,128,0.06);
        color: var(--text-muted);
        font-size: 11px;
        text-align: center;
        margin-top: 6px;
      }

      /* Feedback Line */
      .feedback {
        min-height: 15px;
        text-align: center;
        font-size: 11px;
        color: var(--text-muted);
        margin: 4px 0 2px;
        overflow-wrap: anywhere;
      }
      .feedback.success { color: var(--success); }
      .feedback.error { color: var(--danger); }

      /* Footer */
      .footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-top: 8px;
        margin-top: 4px;
        border-top: 1px solid var(--card-border);
        color: var(--text-muted);
        font-size: 11px;
      }

      .text-btn {
        background: transparent;
        border: none;
        padding: 2px 4px;
        margin: -2px -4px;
        color: var(--text-muted);
        font-size: 11px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        border-radius: 4px;
        transition: color 0.15s;
      }
      .text-btn:hover { color: var(--text); }

      .version {
        font-size: 10.5px;
        opacity: 0.75;
      }
    </style>
  </head>
  <body>
    <!-- Top Header -->
    <div class="header">
      <div class="brand">
        <div class="logo-icon">A</div>
        <h1 class="brand-title">AgentSurf</h1>
      </div>
      <div id="header-status-badge" class="status-badge connected">
        <span class="dot"></span>
        <span id="header-status-text">运行正常</span>
      </div>
    </div>

    <!-- CARD 1: 本地直连 (默认核心基石，置顶常驻展示) -->
    <div class="card">
      <div class="card-header">
        <div class="card-title">
          <span>💻</span>
          <span>本地直连 (Local Native)</span>
        </div>
        <div id="local-status-badge" class="status-badge connected">
          <span class="dot"></span>
          <span id="local-status-text">已就绪</span>
        </div>
      </div>
      <div class="card-row">
        <span class="label">Native Host</span>
        <span class="val" id="host-name">com.browsercontrol.runtime</span>
      </div>
      <p class="card-hint">
        默认启用，支持本地 Claude Desktop、Cursor、Cline 等 AI 客户端直接操控当前浏览器。
      </p>
    </div>

    <!-- CARD 2: 云端网关 (Remote Gateway，同屏卡片化展示，无需切换 Tab) -->
    <div class="card">
      <div class="card-header">
        <div class="card-title">
          <span>🌐</span>
          <span>云端网关 (Remote Gateway)</span>
        </div>
        <label class="switch" title="开启/关闭云端网关">
          <input type="checkbox" id="gateway-toggle" checked />
          <span class="slider"></span>
        </label>
      </div>

      <p class="card-hint" style="margin: 0; padding: 0; border: none;">
        为 Notion AI 等云端应用提供反向通道，远程调度 Mac 本地浏览器。
      </p>

      <!-- Gateway Enabled View -->
      <div id="gateway-content-enabled">
        <!-- Connected View (Hides Domain by Default for Privacy) -->
        <div id="gateway-view-connected" class="gateway-status-box">
          <div style="display: flex; align-items: center; gap: 5px;">
            <span class="dot" style="background: var(--success); box-shadow: 0 0 6px var(--success);"></span>
            <span id="gateway-status-text">网关已配对连接</span>
          </div>
          <button class="text-action" id="btn-edit-config" type="button">⚙️ 修改配置</button>
        </div>

        <!-- Config Form (Shown when editing or unconfigured) -->
        <div id="gateway-view-form" style="display: none;">
          <div class="field">
            <label class="field-label" for="gateway-url">云端网关地址 (Gateway WSS):</label>
            <input id="gateway-url" type="text" placeholder="wss://mcp.example.com:9443/ws" />
          </div>
          <div class="field">
            <label class="field-label" for="gateway-token">配对密钥 (Bearer Token):</label>
            <input id="gateway-token" type="password" placeholder="粘贴从服务器生成的配对密钥" />
          </div>
          <div class="button-row">
            <button class="btn btn-primary" id="btn-save-remote" type="button">保存并连接</button>
            <button class="btn btn-outline" id="btn-cancel-config" type="button">取消</button>
          </div>
        </div>
      </div>

      <!-- Gateway Disabled View -->
      <div id="gateway-content-disabled" class="gateway-disabled-box" style="display: none;">
        云端网关已关闭（仅使用本地直连）
      </div>
    </div>

    <!-- Status Message Feedback -->
    <div id="result" class="feedback"></div>

    <!-- Minimal Footer -->
    <div class="footer">
      <button class="text-btn" id="copy" type="button">
        <span>📋</span>
        <span>复制诊断信息</span>
      </button>
      <span class="version">v0.1.0</span>
    </div>

    <script src="debug/debug.js"></script>
  </body>
</html>
