<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AgentSurf</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
        font-size: 13px;
      }
      body { margin: 0; padding: 14px 16px 18px; width: 340px; }
      h1 { font-size: 15px; margin: 0 0 10px; }
      .state { display: flex; align-items: center; gap: 7px; font-weight: 600; margin-bottom: 10px; }
      .dot { width: 9px; height: 9px; border-radius: 50%; background: #9aa0a6; flex: none; }
      .dot.connected { background: #1e8e3e; }
      .dot.connecting, .dot.reconnecting { background: #f9ab00; }
      .dot.error { background: #d93025; }
      dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 0 0 10px; }
      dt { color: #5f6368; }
      dd { margin: 0; overflow-wrap: anywhere; font-family: ui-monospace, monospace; }
      .buttons { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
      button { font: inherit; padding: 5px 9px; cursor: pointer; }
      h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: #5f6368; margin: 0 0 5px; }
      #events { margin: 0; padding: 0; list-style: none; max-height: 220px; overflow: auto; }
      #events li { display: flex; gap: 7px; padding: 2px 0; border-top: 1px solid rgba(128, 128, 128, .25); }
      #events li:first-child { border-top: none; }
      #events .time { color: #5f6368; font-family: ui-monospace, monospace; flex: none; }
      #events .message { overflow-wrap: anywhere; }
      #events .error .message { color: #d93025; }
      #events .empty { color: #5f6368; border-top: none; }
      #result { min-height: 1.2em; color: #1e8e3e; margin: 8px 0 0; }
    </style>
  </head>
  <body>
    <h1>AgentSurf</h1>
    <p class="state"><span id="state-dot" class="dot"></span><span id="state-text">loading…</span></p>
    <dl>
      <dt>Host</dt>
      <dd id="host-name">com.browsercontrol.runtime</dd>
      <dt>Endpoint</dt>
      <dd id="bridge-url">unavailable</dd>
      <dt>Pending</dt>
      <dd id="pending">0</dd>
    </dl>
    <div class="buttons">
      <button id="connect" type="button">Connect</button>
      <button id="disconnect" type="button">Disconnect</button>
      <button id="reconnect" type="button">Reconnect</button>
      <button id="copy" type="button">Copy diagnostics</button>
    </div>
    <h2>Recent events</h2>
    <ul id="events"><li class="empty">No events yet.</li></ul>
    <p id="result"></p>
    <script src="debug/debug.js"></script>
  </body>
</html>
